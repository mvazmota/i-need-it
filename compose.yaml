services:
  web:
    build: .
    image: ineedit:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/ineedit.db
    ports:
      - "3000:3000"
    volumes:
      - ineedit_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ineedit:latest
    restart: unless-stopped
    init: true
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/ineedit.db
    volumes:
      - ineedit_data:/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  ineedit_data:
